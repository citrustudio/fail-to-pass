name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install live reporter fixture
        run: npm install --prefix "$RUNNER_TEMP/reporter" --ignore-scripts --no-audit --no-fund vitest@4.1.10
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
        env:
          FAIL_TO_PASS_VITEST_MODULE: ${{ runner.temp }}/reporter/node_modules/vitest/dist/index.js
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: cd "$RUNNER_TEMP" && fail-to-pass --help && fail-to-pass measure --help
